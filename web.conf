<?xml version="1.0" encoding="utf-8"?>
<!--
  LIVE web.config for the website on Windows/IIS (replaces the nginx ahh.conf).
  Put it in the ROOT FOLDER of the IIS site (next to the site files).
  1. Replace every  aarogyahastha.com  with your real domain.
  2. Install on the server: URL Rewrite + Application Request Routing (ARR),
     then IIS Manager > server name > Application Request Routing Cache >
     Server Proxy Settings > tick "Enable proxy" > Apply.
  3. The app that nginx proxied to (127.0.0.1:5000) must be running on this machine.
-->
<configuration>
  <system.webServer>

    <rewrite>

      <!-- PAGE-SPECIFIC REDIRECTS: one line per old URL (key = old path, value = new path).
           ignoreCase="false" copies nginx "location =" behaviour. It is REQUIRED here, because
           entries such as /departments/Urology to /departments/urology differ only by case
           and would otherwise loop forever. -->
      <rewriteMaps>
        <rewriteMap name="PageRedirects" ignoreCase="false">
          <add key="/about-us" value="/about" />
          <add key="/appointment" value="/appointments" />
          <add key="/services" value="/" />
          <add key="/index.php" value="/" />
          <add key="/index.html" value="/" />
          <add key="/contact.php" value="/contact" />
          <add key="/appointment.php" value="/" />
          <add key="/about.php" value="/about" />
          <add key="/health_packages" value="/health-packages" />
          <add key="/sports_packages" value="/sports-packages" />
          <add key="/departments.php" value="/departments/" />
          <add key="/index" value="/" />
          <add key="/None" value="/" />
          <add key="/none" value="/" />
          <add key="/submit-review" value="/" />
          <add key="/request_callback" value="/" />
          <add key="/career" value="/" />
          <add key="/service" value="/" />
          <add key="/doctors/dr.-santhosh-r" value="/doctors/dr-santosh" />
          <add key="/doctors/dr.-santhosh" value="/doctors/dr-santosh" />
          <add key="/doctors/dr.-santhosh-r-1" value="/doctors/dr-santosh" />
          <add key="/departments/Urology" value="/departments/urology" />
          <add key="/departments/Orthopaedics" value="/departments/orthopaedics" />
          <add key="/departments/Cardiology" value="/departments/cardiology" />
          <add key="/departments/Neurology" value="/departments/neurology" />
          <add key="/departments/Physiotherapy" value="/departments/physiotherapy" />
          <add key="/departments/Dermatology" value="/departments/dermatology" />
          <add key="/departments/pain_medicine" value="/departments/pain-medicine" />
          <add key="/departments/medical_gastroenterology" value="/departments/medical-gastroenterology" />
          <add key="/departments/surgical_gastroenterology" value="/departments/surgical-gastroenterology" />
          <add key="/departments/general_surgery" value="/departments/general-surgery" />
          <add key="/departments/lab_medicine" value="/departments/lab-medicine" />
          <add key="/departments/emergency_medicine" value="/departments/emergency-medicine" />
          <add key="/departments/general_medicine" value="/departments/general-medicine" />
          <add key="/departments/minimal_access_surgery" value="/departments/minimal-access-surgery" />
          <add key="/departments/plastic_surgery" value="/departments/plastic-surgery" />
          <add key="/departments/paediatric" value="/departments/paediatrics" />
          <add key="/departments-new/orthopaedics" value="/departments/orthopaedics" />
          <add key="/privacy_policy" value="/privacy-policy" />
          <add key="/terms_and_conditions" value="/terms-and-conditions" />
          <add key="/doctors/dr-geetha" value="/doctors/dr-geetha-r" />
          <add key="/doctors/dr" value="/doctors" />
          <add key="/doctors/dr-janaki-ram" value="/doctors" />
          <add key="/doctors/dr.-sowmya" value="/doctors/dr-soumya" />
          <add key="/doctors/dr-saraswathi-m" value="/doctors/dr.-saraswathi-m" />
          <add key="/doctors/Dt Neelima Sharma" value="/doctors/dt-neelima-sharma" />
          <add key="/doctors/dr magesh b" value="/doctors/dr-magesh-b" />
          <add key="/foundations.php" value="/" />
          <add key="/career.php" value="/" />
          <add key="/best-physiotherapy-rehabilitation-center-in-hsrlayout-bangalore" value="/physiotherapy-in-hsr-layout-bangalore" />
          <add key="/best-hospital-in-electronic-city-bangalore/" value="/best-hospital-in-electronic-city-bangalore" />
          <add key="/best-hospital-in-hosa-road-bangalore/" value="/best-hospital-in-hosa-road-bangalore" />
          <add key="/best-hospital-in-hsr-bangalore/" value="/best-hospital-in-hsr-bangalore" />
          <add key="/best-hospital-in-sarjapur-road-bangalore/" value="/best-hospital-in-sarjapur-road-bangalore" />
          <add key="/best-plastic-surgeon-in-bangalore/" value="/best-plastic-surgeon-in-bangalore" />
        </rewriteMap>
      </rewriteMaps>

      <rules>

        <!-- 1. Block SEO crawler bots (nginx: return 444) -->
        <rule name="Block bad bots" stopProcessing="true">
          <match url=".*" />
          <conditions>
            <add input="{HTTP_USER_AGENT}" pattern="AhrefsBot|SemrushBot|MJ12bot|DotBot|SeekBot|Barkrowler|Baiduspider|YandexBot" />
          </conditions>
          <action type="AbortRequest" />
        </rule>

        <!-- 2. www to non-www -->
        <rule name="www to non-www" stopProcessing="true">
          <match url="(.*)" />
          <conditions>
            <add input="{HTTP_HOST}" pattern="^www\.aarogyahastha\.com$" />
          </conditions>
          <action type="Redirect" url="https://aarogyahastha.com/{R:1}" redirectType="Permanent" />
        </rule>

        <!-- 3. HTTP to HTTPS (only for your real domain, so localhost still works for testing) -->
        <rule name="HTTP to HTTPS" stopProcessing="true">
          <match url="(.*)" />
          <conditions>
            <add input="{HTTPS}" pattern="off" ignoreCase="true" />
            <add input="{HTTP_HOST}" pattern="^(admin\.)?aarogyahastha\.com$" />
          </conditions>
          <action type="Redirect" url="https://aarogyahastha.com/{R:1}" redirectType="Permanent" />
        </rule>

        <!-- 4. Old Google search URL: /search?q={search_term_string} to home.
                (nginx never matched this one, because location ignores query strings.) -->
        <rule name="Search placeholder to home" stopProcessing="true">
          <match url="^search$" />
          <conditions>
            <add input="{QUERY_STRING}" pattern="^q=(%7B|\{)search_term_string(%7D|\})$" />
          </conditions>
          <action type="Redirect" url="/" appendQueryString="false" redirectType="Permanent" />
        </rule>

        <!-- 5. All page-specific redirects, from the map above (query string dropped, like nginx) -->
        <rule name="Page redirects" stopProcessing="true">
          <match url=".*" />
          <conditions>
            <add input="{PageRedirects:{PATH_INFO}}" pattern="(.+)" />
          </conditions>
          <action type="Redirect" url="{C:1}" appendQueryString="false" redirectType="Permanent" />
        </rule>

        <!-- 6. Any other  /something.html  to  /something  (nginx: location ~ ^/(.*)\.html$) -->
        <rule name="Remove .html extension" stopProcessing="true">
          <match url="^(.+)\.html$" />
          <conditions>
            <add input="{PATH_INFO}" pattern="^/(404|50x)\.html$" negate="true" />
            <add input="{PATH_INFO}" pattern="^/google[0-9a-f]+\.html$" negate="true" />
          </conditions>
          <action type="Redirect" url="/{R:1}" appendQueryString="false" redirectType="Permanent" />
        </rule>

        <!-- 7. Any other .php URL gives 404 (nginx: location ~ \.php$ { return 404; }) -->
        <rule name="Other php files 404" stopProcessing="true">
          <match url="\.php$" />
          <action type="CustomResponse" statusCode="404" statusReason="Not Found" statusDescription="Not Found" />
        </rule>

        <!-- 8. EVERYTHING ELSE goes to the website app on port 5000 (nginx: location / { proxy_pass ... }).
                Real files in the IIS site folder (sitemap.xml, robots.txt, llms.txt,
                the .well-known certificate check) are served directly by IIS first. -->
        <rule name="Proxy to app on port 5000" stopProcessing="true">
          <match url="(.*)" />
          <conditions>
            <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
          </conditions>
          <action type="Rewrite" url="http://127.0.0.1:5000/{R:1}" />
          <!-- OPTIONAL, needs one-time setup (IIS Manager > URL Rewrite > View Server Variables > add
               HTTP_X_FORWARDED_PROTO and HTTP_X_FORWARDED_FOR). Then uncomment:
          <serverVariables>
            <set name="HTTP_X_FORWARDED_PROTO" value="https" />
            <set name="HTTP_X_FORWARDED_FOR" value="{REMOTE_ADDR}" />
          </serverVariables>
          -->
        </rule>

      </rules>
    </rewrite>

    <!-- Security headers (same as the nginx add_header lines) -->
    <httpProtocol>
      <customHeaders>
        <add name="X-Frame-Options" value="SAMEORIGIN" />
        <add name="X-Content-Type-Options" value="nosniff" />
        <add name="Referrer-Policy" value="strict-origin-when-cross-origin" />
        <!-- Turn on only AFTER https works everywhere (browsers then refuse plain http for 2 years):
        <add name="Strict-Transport-Security" value="max-age=63072000" />
        -->
      </customHeaders>
    </httpProtocol>

    <!-- 50 MB uploads (nginx: client_max_body_size 50M) -->
    <security>
      <requestFiltering>
        <requestLimits maxAllowedContentLength="52428800" />
      </requestFiltering>
    </security>

  </system.webServer>
</configuration>